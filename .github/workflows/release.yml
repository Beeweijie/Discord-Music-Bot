name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v1.0.0)
        required: true
        type: string
permissions:
  contents: write
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Linux queues, virtual environments, updates and rollback
        run: python -m unittest discover -s tests -v
      - name: Install optional voice dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus0
          python -m pip install -r requirements-voice.txt
      - name: Verify optional voice commands
        run: python -m unittest discover -s tests -v
  release:
    needs: linux-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-voice.txt
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Validate installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd/scripts/setup_windows.ps1", [ref]$tokens, [ref]$errors) > $null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Build distribution
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/build_release.py $env:RELEASE_TAG
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
            $notes = "docs/release-notes/$env:RELEASE_TAG.md"
            $createArgs = @('release', 'create', $env:RELEASE_TAG, '--draft', '--verify-tag', '--title', "Discord Music Bot $env:RELEASE_TAG")
            if (Test-Path -LiteralPath $notes) {
              $createArgs += @('--notes-file', $notes)
            } else {
              $createArgs += '--generate-notes'
            }
            gh @createArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $assets = @(Get-ChildItem dist -File | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --draft=false
