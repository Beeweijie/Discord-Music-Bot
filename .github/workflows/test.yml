name: Regression tests
on:
  push:
    branches: [main, 'codex/haiyang-voice']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install base dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete base regression suite
        run: python -m unittest discover -s tests -v
      - name: Install native Opus for optional voice
        if: runner.os == 'Linux' && hashFiles('requirements-voice.txt') != ''
        run: sudo apt-get update && sudo apt-get install -y libopus0
      - name: Install optional voice dependencies
        if: hashFiles('requirements-voice.txt') != ''
        run: python -m pip install -r requirements-voice.txt
      - name: Run complete regression suite with optional voice
        if: hashFiles('requirements-voice.txt') != ''
        run: python -m unittest discover -s tests -v
      - name: Build distribution
        run: python scripts/build_release.py v1.3.0
